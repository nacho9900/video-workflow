[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-workflow"
version = "0.1.0"
description = "Local, reproducible video editing workflow for humans and agents"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3,<3", "Pillow>=12.3,<13"]

[project.scripts]
video-workflow = "video_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
